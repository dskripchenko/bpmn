<svg xmlns="http://www.w3.org/2000/svg" id="dmn-xfva5o" class="bpmn dmn" width="375" height="235" viewBox="80 70 375 235" role="img" aria-labelledby="dmn-xfva5o-title" style="max-width:100%;height:auto"><title id="dmn-xfva5o-title">Shipping</title><style>#dmn-xfva5o{font-family:var(--bpmn-font-family, Arial, "Helvetica Neue", Helvetica, sans-serif);background:var(--bpmn-background, transparent)}#dmn-xfva5o .bpmn-shape{fill:var(--bpmn-fill, #ffffff);stroke:var(--bpmn-stroke, #22242a);stroke-width:2px}#dmn-xfva5o .bpmn-thin{stroke-width:1.5px}#dmn-xfva5o .bpmn-thick{stroke-width:4px}#dmn-xfva5o .bpmn-call{stroke-width:5px}#dmn-xfva5o .bpmn-dashed{stroke-dasharray:6 4}#dmn-xfva5o .bpmn-dotted{stroke-dasharray:1.5 3;stroke-linecap:round}#dmn-xfva5o .bpmn-pool{fill:var(--bpmn-pool-fill, #ffffff);stroke:var(--bpmn-stroke, #22242a);stroke-width:1.5px}#dmn-xfva5o .bpmn-lane{fill:var(--bpmn-lane-fill, transparent);stroke:var(--bpmn-stroke, #22242a);stroke-width:1px}#dmn-xfva5o .bpmn-group{fill:none;stroke:var(--bpmn-group-stroke, #22242a);stroke-width:1px;stroke-dasharray:10 4 1 4}#dmn-xfva5o .bpmn-annotation{fill:none;stroke:var(--bpmn-annotation-stroke, #22242a);stroke-width:1px}#dmn-xfva5o .bpmn-icon{fill:none;stroke:var(--bpmn-stroke, #22242a);stroke-width:1.5px;stroke-linejoin:round}#dmn-xfva5o .bpmn-icon-fill{fill:var(--bpmn-stroke, #22242a);stroke:var(--bpmn-stroke, #22242a);stroke-width:1px;stroke-linejoin:round}#dmn-xfva5o .bpmn-icon-inverse{fill:var(--bpmn-fill, #ffffff);stroke:var(--bpmn-fill, #ffffff);stroke-width:1px}#dmn-xfva5o .bpmn-flow{fill:none;stroke:var(--bpmn-stroke, #22242a);stroke-width:1.5px;stroke-linejoin:round}#dmn-xfva5o .bpmn-message-flow{stroke-dasharray:10 6}#dmn-xfva5o .bpmn-association{stroke-dasharray:1 4;stroke-linecap:round}#dmn-xfva5o .bpmn-head{fill:var(--bpmn-stroke, #22242a);stroke:var(--bpmn-stroke, #22242a);stroke-width:1px;stroke-linejoin:round}#dmn-xfva5o .bpmn-head-open{fill:var(--bpmn-fill, #ffffff);stroke:var(--bpmn-stroke, #22242a);stroke-width:1.5px;stroke-linejoin:round}#dmn-xfva5o .bpmn-head-line{fill:none;stroke:var(--bpmn-stroke, #22242a);stroke-width:1.5px;stroke-linejoin:round}#dmn-xfva5o .bpmn-label{fill:var(--bpmn-text, #22242a);font-size:12px}#dmn-xfva5o .bpmn-label-external{font-size:11px}#dmn-xfva5o .bpmn-label-halo{stroke:var(--bpmn-label-halo, #ffffff);stroke-width:3px;paint-order:stroke;stroke-linejoin:round}</style><g class="bpmn-layer bpmn-layer-containers"/><g class="bpmn-layer bpmn-layer-shapes"><g class="bpmn-element dmn-type-decision" data-element-id="shippingMethod"><rect x="200" y="80" width="180" height="80" class="bpmn-shape"/><rect x="206" y="86" width="16" height="12" class="bpmn-icon" style="stroke-width:1px"/><path d="M206,90 L222,90 M206,94 L222,94 M212,90 L212,98" class="bpmn-icon" style="stroke-width:1px"/><text class="bpmn-label" text-anchor="middle"><tspan x="290" y="123.6">Shipping method</tspan></text></g><g class="bpmn-element dmn-type-inputData" data-element-id="weight"><rect x="90" y="250" width="125" height="45" rx="22.5" class="bpmn-shape"/><text class="bpmn-label" text-anchor="middle"><tspan x="152.5" y="276.1">Parcel weight</tspan></text></g><g class="bpmn-element dmn-type-inputData" data-element-id="express"><rect x="320" y="250" width="125" height="45" rx="22.5" class="bpmn-shape"/><text class="bpmn-label" text-anchor="middle"><tspan x="382.5" y="276.1">Express delivery</tspan></text></g></g><g class="bpmn-layer bpmn-layer-flows"><g class="bpmn-element dmn-type-informationRequirement" data-element-id="weight→shippingMethod"><path d="M150,250 L250,160" class="bpmn-flow"/><path d="M250,160 L245.17,171.08 L238.48,163.64 Z" class="bpmn-head"/></g><g class="bpmn-element dmn-type-informationRequirement" data-element-id="express→shippingMethod"><path d="M380,250 L330,160" class="bpmn-flow"/><path d="M330,160 L339.71,167.19 L330.97,172.04 Z" class="bpmn-head"/></g></g></svg>